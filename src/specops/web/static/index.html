<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpecOps Agents</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    try { const t = localStorage.getItem("specops.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg>
      <span class="wordmark">SpecOps <b>Agents</b></span>
      <span class="live" id="live" title="Connection"><i></i><span>connecting</span></span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <label class="follow" title="Automatically jump to the session that is working">
        <input type="checkbox" id="follow" checked> <span>Follow</span>
      </label>
      <button class="icon-btn" id="theme" title="Toggle theme (t)" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" placeholder="Filter sessions…  /" autocomplete="off" spellcheck="false">
      </div>
      <nav id="sessions" class="sessions" aria-label="Sessions"></nav>
    </aside>

    <main id="main" class="main"></main>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-scrim" data-close></div>
    <section class="drawer-panel" role="dialog" aria-label="Agent timeline">
      <div id="drawer-body"></div>
    </section>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="mark" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="9.5"/>
        <path d="M16 2v7M16 23v7M2 16h7M23 16h7"/>
      </g>
      <circle cx="16" cy="16" r="2.6" fill="currentColor"/>
    </symbol>
  </svg>
  <script src="/static/app.js"></script>
</body>
</html>
