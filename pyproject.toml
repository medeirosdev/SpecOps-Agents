[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "specops-agents"
version = "0.3.0"
description = "Mission control for your Claude Code and Antigravity agents: watch every agent and subagent work in real time, in the terminal or in the browser."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Medeiros", email = "guilherme.ggcm20@gmail.com" }]
keywords = ["claude", "claude-code", "antigravity", "gemini", "agents", "subagents", "tui", "dashboard", "observability", "textual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: System :: Monitoring",
]
dependencies = ["textual>=1.0"]

[project.urls]
Homepage = "https://github.com/medeirosdev/SpecOps-Claude"
Issues = "https://github.com/medeirosdev/SpecOps-Claude/issues"

[project.scripts]
specops = "specops.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/specops"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Scripted demo scenarios: long lines are fake tool output, clearer kept whole.
"src/specops/demo.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
