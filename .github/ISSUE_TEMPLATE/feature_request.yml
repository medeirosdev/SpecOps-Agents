name: Feature request
description: An idea to make SpecOps Claude more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to see or do?
      description: Describe the situation, not just the solution. What's hard to follow today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: ui
    attributes:
      label: Which UI?
      options: [Terminal (tui), Browser (web), Both, Not UI specific]
